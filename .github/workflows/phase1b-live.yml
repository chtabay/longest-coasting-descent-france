name: Phase 1B live Oisans

on:
  workflow_dispatch:

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - name: Reconstruct compact live Oisans data
        run: PYTHONPATH=src python scripts/phase1b_live_oisans.py
      - name: Require provenance and checksums
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("outputs/phase1/live/data_manifest.json").read_text())
          assert manifest["source"] == "live"
          assert manifest["osm"]["response_sha256"]
          assert manifest["altimetry_cache_files"]
          assert all(item["sha256"] for item in manifest["altimetry_cache_files"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase1b-live-oisans
          path: outputs/phase1/live/
