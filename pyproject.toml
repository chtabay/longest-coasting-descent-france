[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coastdown-france"
version = "0.1.0"
description = "Reference study for the longest bicycle coasting descent in France"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
geo = [
  "geopandas",
  "networkx",
  "osmnx",
  "pyarrow",
  "pyproj",
  "rasterio",
  "shapely",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
