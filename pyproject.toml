[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coastdown-france"
version = "0.1.0"
description = "Reference study for the longest bicycle coasting descent in France"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# ruff is pinned exactly: its *default* rule set changes between releases, so an
# unpinned `ruff check .` makes CI non-reproducible and can turn red without any
# repository change. Bump this deliberately, never implicitly.
dev = [
  "pytest>=8,<10",
  "ruff==0.16.1",
]
geo = [
  "geopandas",
  "networkx",
  "osmnx",
  "pyarrow",
  "pyproj",
  "rasterio",
  "shapely",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
